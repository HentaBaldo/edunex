<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNex — Canlı Ders</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        #jitsi-container {
            flex: 1; 
            width: 100%;
        }

        #jitsi-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }

        .yukleniyor {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #94a3b8;
            gap: 14px;
            text-align: center;
        }
        .yukleniyor .spinner {
            width: 48px; height: 48px;
            border: 4px solid #334155;
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="jitsi-container">
        <div class="yukleniyor">
            <div class="spinner"></div>
            <p>Canlı ders odası yükleniyor...</p>
        </div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    
    <script>
        (function () {
            'use strict';

            const yolParcalari = window.location.pathname.split('/').filter(Boolean);
            const odaAdi = decodeURIComponent(yolParcalari[yolParcalari.length - 1] || '');
            let currentSessionId = localStorage.getItem('current_live_session_id'); 
            let heartbeatInterval = null;

            const container = document.getElementById('jitsi-container');

            if (!odaAdi || odaAdi === 'canli-ders') {
                container.innerHTML = '<div class="yukleniyor"><p style="color:#fca5a5;">Geçersiz oda adresi.</p></div>';
                return;
            }

            let displayName = 'Misafir Kullanıcı';
            let email = '';
            let isInstructor = false;
            const token = localStorage.getItem('edunex_token');
            
            try {
                const u = JSON.parse(localStorage.getItem('edunex_user') || '{}');
                if (u.ad || u.soyad) displayName = `${u.ad || ''} ${u.soyad || ''}`.trim();
                if (u.eposta) email = u.eposta;
                if (u.rol === 'egitmen') isInstructor = true;
            } catch (_) {}

            // Yoklama Gönderme Fonksiyonu
            const sendHeartbeat = async () => {
                if (!currentSessionId || !token) return;
                try {
                    await fetch(`/api/live-sessions/${currentSessionId}/heartbeat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    console.log("[HEARTBEAT] Yoklama sinyali gönderildi.");
                } catch (error) {
                    console.error("[HEARTBEAT] Hata:", error);
                }
            };

            const baslat = async function () {
                if (typeof JitsiMeetExternalAPI === 'undefined') {
                    container.innerHTML = '<div class="yukleniyor"><p style="color:#fca5a5;">Jitsi API yüklenemedi. İnternet bağlantınızı kontrol edin.</p></div>';
                    return;
                }

                container.innerHTML = '';
                
                const jitsiDiv = document.createElement('div');
                jitsiDiv.style.width = '100%';
                jitsiDiv.style.height = '100%';
                container.appendChild(jitsiDiv);

                const api = new JitsiMeetExternalAPI('meet.jit.si', {
                    roomName: odaAdi,
                    parentNode: jitsiDiv,
                    width: '100%',
                    height: '100%',
                    userInfo: { displayName, email },
                    configOverwrite: {
                        prejoinPageEnabled: false,
                        disableDeepLinking: true,
                    },
                    interfaceConfigOverwrite: {
                        SHOW_JITSI_WATERMARK: false,
                        DEFAULT_BACKGROUND: '#000000',
                    },
                });

                api.addEventListener('videoConferenceJoined', () => {
                    console.log("Derse katılıldı, Yoklama (Heartbeat) başlatılıyor...");
                    if(currentSessionId) {
                        sendHeartbeat();
                        heartbeatInterval = setInterval(sendHeartbeat, 60000);
                    }
                });

                api.addEventListener('readyToClose', () => {
                    if(heartbeatInterval) clearInterval(heartbeatInterval);
                    if(isInstructor) {
                        window.location.href = '/instructor/live-sessions.html';
                    } else {
                        window.location.href = '/main/index.html';
                    }
                });
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', baslat);
            } else {
                baslat();
            }
        })();
    </script>
</body>
</html>
