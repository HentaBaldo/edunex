<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNex — Canlı Ders</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
        }
        
        #jitsi-container {
            flex: 1; 
            width: 100%;
        }

        #jitsi-container iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
            display: block;
        }

        .yukleniyor {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #94a3b8;
            gap: 14px;
            text-align: center;
        }
        .yukleniyor .spinner {
            width: 48px; height: 48px;
            border: 4px solid #334155;
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="jitsi-container">
        <div class="yukleniyor">
            <div class="spinner"></div>
            <p>Canlı ders odası yükleniyor...</p>
        </div>
    </div>

    <script src="https://meet.jit.si/external_api.js"></script>
    
    <script>
        (function () {
            'use strict';

            const yolParcalari = window.location.pathname.split('/').filter(Boolean);
            const odaAdi = decodeURIComponent(yolParcalari[yolParcalari.length - 1] || '');
            let currentSessionId = localStorage.getItem('current_live_session_id');
            let heartbeatInterval = null;
            let jitsiApi = null;           // tekil API instance — cift mount koruma
            let baslatildiMi = false;      // baslat() yeniden tetiklenirse no-op

            const container = document.getElementById('jitsi-container');

            if (!odaAdi || odaAdi === 'canli-ders') {
                container.innerHTML = '<div class="yukleniyor"><p style="color:#fca5a5;">Geçersiz oda adresi.</p></div>';
                return;
            }

            let displayName = 'Misafir Kullanıcı';
            let email = '';
            let isInstructor = false;
            const token = localStorage.getItem('edunex_token');
            
            try {
                const u = JSON.parse(localStorage.getItem('edunex_user') || '{}');
                if (u.ad || u.soyad) displayName = `${u.ad || ''} ${u.soyad || ''}`.trim();
                if (u.eposta) email = u.eposta;
                if (u.rol === 'egitmen') isInstructor = true;
            } catch (_) {}

            // Yoklama Gönderme Fonksiyonu
            const sendHeartbeat = async () => {
                if (!currentSessionId || !token) return;
                try {
                    await fetch(`/api/live-sessions/${currentSessionId}/heartbeat`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    console.log("[HEARTBEAT] Yoklama sinyali gönderildi.");
                } catch (error) {
                    console.error("[HEARTBEAT] Hata:", error);
                }
            };

            const baslat = async function () {
                // Mukerrer mount koruma: DOMContentLoaded + script tag race'inde 2x baslat tetiklenirse
                // ikinci JitsiMeetExternalAPI instance ayni iframe'i ezerek pop-up benzeri davranisa yol acabilir.
                if (baslatildiMi) {
                    console.warn('[live-room] baslat() mukerrer cagri yok sayildi.');
                    return;
                }
                baslatildiMi = true;

                if (typeof JitsiMeetExternalAPI === 'undefined') {
                    container.innerHTML = '<div class="yukleniyor"><p style="color:#fca5a5;">Jitsi API yüklenemedi. İnternet bağlantınızı kontrol edin.</p></div>';
                    return;
                }

                container.innerHTML = '';

                const jitsiDiv = document.createElement('div');
                jitsiDiv.style.width = '100%';
                jitsiDiv.style.height = '100%';
                container.appendChild(jitsiDiv);

                jitsiApi = new JitsiMeetExternalAPI('meet.jit.si', {
                    roomName: odaAdi,
                    parentNode: jitsiDiv,
                    width: '100%',
                    height: '100%',
                    // userInfo.moderator: meet.jit.si'da JWT yoksa zorlayici degil ama destekleyen
                    // deployment'lara egitmen rolu hint'i gonderir. Boylece "I am the host" pop-up'i
                    // tetiklenme olasiligi azalir.
                    userInfo: { displayName, email, moderator: isInstructor },
                    configOverwrite: {
                        // --- Prejoin/Lobi tamamen kapali: ekstra auth ekranlari tetiklenmesin ---
                        prejoinPageEnabled: false,
                        prejoinConfig: { enabled: false },
                        disableDeepLinking: true,
                        requireDisplayName: false,
                        enableLobby: false,
                        enableInsecureRoomNameWarning: false,

                        // --- "I am the host" pop-up'ini tetikleyen flag'leri KAPATIYORUZ ---
                        // JWT/JaaS olmadan bunlari true yapmak meet.jit.si'da auth popup aciyor:
                        //   enableModeratorIndicator: true   <-- moderator claim flow tetikler
                        //   enableAVModeration: true         <-- moderator yetkisi sorar
                        //   enableLobbyChat: true            <-- lobi/host onay akisi acar
                        // Bu nedenle false birakildilar. A/V kontrolu icin toolbar'daki 'mute-everyone'
                        // butonu zaten yeterli; her seferinde host-auth gerektirmez.
                        disableModeratorIndicator: true,

                        // 3. parti istekleri (gravatar/analytics/auth iframe) engelle.
                        // Tarayicinin ek pencere acma riskini azaltir.
                        disableThirdPartyRequests: true,

                        // Kullanicinin kendi cihazi: ister egitmen ister ogrenci, sessiz/kamerasiz baslar.
                        startWithAudioMuted: true,
                        startWithVideoMuted: true,
                        // Odadaki tum katilimcilar (1. kisiden itibaren) mikrofon/kamera kapali baslar.
                        startAudioMuted: 0,
                        startVideoMuted: 0,

                        localRecording: {
                            enabled: true,
                            format: 'webm'
                        },

                        // Sade toolbar — kaldirilan butonlar host-auth/pop-up tetikleyenler:
                        //   'security'       -> oda parolasi/lobi yonetimi, host login isteyebilir
                        //   'invite'         -> link kopyalama disindaki "send invite" akisi, popup acabilir
                        //   'livestreaming'  -> YouTube/Twitch baglama icin auth popup
                        //   'mute-everyone'  -> bazi deployment'larda moderator login ister
                        //   'feedback','stats','shortcuts','etherpad','sharedvideo' -> gereksiz
                        toolbarButtons: [
                            'microphone', 'camera', 'desktop', 'fullscreen',
                            'fodeviceselection', 'hangup', 'profile', 'chat',
                            'recording', 'settings', 'raisehand', 'videoquality',
                            'filmstrip', 'tileview', 'select-background'
                        ]
                    },
                    interfaceConfigOverwrite: {
                        SHOW_JITSI_WATERMARK: false,
                        SHOW_WATERMARK_FOR_GUESTS: false,
                        DEFAULT_BACKGROUND: '#000000',
                        // Auth-prompt'a goturen UI elemanlari gizlenir.
                        AUTHENTICATION_ENABLE: false,
                        SHOW_BRAND_WATERMARK: false,
                        HIDE_INVITE_MORE_HEADER: true,
                        DISABLE_PRESENCE_STATUS: true,
                    },
                });

                jitsiApi.addEventListener('videoConferenceJoined', () => {
                    console.log("[live-room] Derse katilindi. Yoklama (heartbeat) baslatiliyor.");
                    if (currentSessionId) {
                        sendHeartbeat();
                        heartbeatInterval = setInterval(sendHeartbeat, 60000);
                    }
                });

                // Ders sona erdi broadcast sabitleri.
                // recipient='' Jitsi'da broadcast olarak desteklenmedigi icin
                // her katilimciya tek tek goneriyoruz (getParticipantsInfo).
                const DERS_BITTI_SIGNAL = 'edunex:DERS_SONA_ERDI';

                // === OGRENCI: bitis sinyali dinleyici ===
                // Egitmen yayindan ciktiginda gelen broadcast'i yakalar, kisa bir
                // bilgilendirme banner'i goster ve ardindan kullaniciyi otomatik cikar.
                // NOT: Bu UX iyilestirmesidir — Jitsi server-side moderator akisi
                // (JWT/JaaS) olmadigi icin kotuye kullanim defansif degil, ancak
                // gonderim tarafi `isInstructor` ile kilitli oldugu icin normal akista
                // sadece egitmen tetikleyebilir.
                if (!isInstructor) {
                    jitsiApi.addEventListener('endpointTextMessageReceived', (event) => {
                        let payload = null;
                        try { payload = JSON.parse(event?.data?.eventData?.text || '{}'); } catch (_) {}
                        if (!payload || payload.tip !== DERS_BITTI_SIGNAL) return;

                        gosterDersBittiBanner();
                        // Kullanicinin mesaji okuyabilmesi icin kisa gecikme,
                        // ardindan hangup -> readyToClose listener'i dispose+redirect halleder.
                        setTimeout(() => {
                            try { jitsiApi.executeCommand('hangup'); } catch (_) {}
                        }, 2500);
                    });
                }

                jitsiApi.addEventListener('readyToClose', () => {
                    if (heartbeatInterval) clearInterval(heartbeatInterval);

                    // Egitmen ayriliyorsa: tum katilimcilara "ders sona erdi" sinyali
                    // gonder, ardindan dispose+redirect. Sinyalin teslim olmasi icin
                    // dispose oncesinde kucuk bir delay birakiyoruz.
                    if (isInstructor) {
                        try {
                            const payload = JSON.stringify({ tip: DERS_BITTI_SIGNAL });
                            const participants = (jitsiApi.getParticipantsInfo && jitsiApi.getParticipantsInfo()) || [];
                            participants.forEach(p => {
                                if (!p || !p.participantId) return;
                                try {
                                    jitsiApi.executeCommand('sendEndpointTextMessage', p.participantId, payload);
                                } catch (_) {}
                            });
                        } catch (e) {
                            console.warn('[live-room] Bitis sinyali gonderilemedi:', e);
                        }
                        setTimeout(() => {
                            try { jitsiApi && jitsiApi.dispose(); } catch (_) {}
                            window.location.href = '/instructor/live-sessions.html';
                        }, 500);
                        return;
                    }

                    // Ogrenci normal akis: dispose + ana sayfaya yonlendir.
                    try { jitsiApi && jitsiApi.dispose(); } catch (_) {}
                    window.location.href = '/main/index.html';
                });

                // Jitsi auth/popup akisini gozlemle — yalniz logla, davranisi degistirmiyoruz.
                // (Bu listener'lar window.open CAGIRMAZ; sadece debug icin.)
                jitsiApi.addEventListener('errorOccurred', (e) => {
                    console.warn('[live-room] Jitsi errorOccurred:', e);
                });
                jitsiApi.addEventListener('passwordRequired', () => {
                    console.warn('[live-room] passwordRequired event — odaya parola zorunlu, sessizce yok sayildi.');
                });
            };

            function gosterDersBittiBanner() {
                if (document.getElementById('ders-sona-erdi-banner')) return;
                const banner = document.createElement('div');
                banner.id = 'ders-sona-erdi-banner';
                banner.style.cssText = [
                    'position:fixed', 'top:20px', 'right:20px',
                    'background:#dc2626', 'color:#fff',
                    'padding:14px 18px', 'border-radius:10px',
                    'font-weight:600', 'font-size:0.95rem', 'line-height:1.4',
                    'box-shadow:0 8px 24px rgba(0,0,0,0.3)',
                    'z-index:2147483647',
                    'font-family:system-ui,-apple-system,"Segoe UI",sans-serif',
                    'max-width:340px'
                ].join(';');
                banner.textContent = 'Ders sona erdi, toplantıdan çıkarılıyorsunuz...';
                document.body.appendChild(banner);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', baslat);
            } else {
                baslat();
            }
        })();
    </script>
</body>
</html>
